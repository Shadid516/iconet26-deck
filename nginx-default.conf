server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # On-the-fly gzip for anything without a pre-compressed twin
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # Serve pre-compressed .gz files (built into the image) instantly
    gzip_static on;

    location / {
        try_files $uri $uri/ =404;
    }
}
